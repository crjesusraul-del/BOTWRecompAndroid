name: Apply Clear Fog Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply Mali, Clear Fog and 8GB RAM cache options
        run: |
          cat << 'EOF' > /tmp/patch_fog.py
          from pathlib import Path

          def patch(path_str, replacements):
              p = Path(path_str)
              s = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  if new in s:
                      continue
                  assert old in s, f"Pattern not found in {path_str}:\n{old[:120]}"
                  assert s.count(old) == 1, f"Multiple matches in {path_str}"
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")

          patch("runtime/settings.h", [
              (
                  "    bool clear_fog;       // Reduces atmospheric fog veil on the 3D scene before HUD",
                  "    bool clear_fog;       // Reduces atmospheric fog veil on the 3D scene before HUD\n"
                  "    bool half_textures;   // Load compressed world textures from mip 1 (1/4 VRAM & bandwidth)\n"
                  "    bool no_gbuffer_split;// Do not split long G-buffer render passes on Mali\n"
                  "    bool adpf_gpu;        // Send GPU time hints to Android ADPF (API 35+)\n"
                  "    bool no_shadows;      // Disable dynamic shadow map comparisons for extra FPS\n"
                  "    bool high_ram_cache;  // Use more RAM (8GB+ devices) for pipeline & buffer caches",
              ),
          ])

          patch("runtime/settings.c", [
              (
                  "    .clear_fog = false,",
                  "    .clear_fog = false,\n"
                  "    .half_textures = false,\n"
                  "    .no_gbuffer_split = false,\n"
                  "    .adpf_gpu = false,\n"
                  "    .no_shadows = false,\n"
                  "    .high_ram_cache = false,",
              ),
              (
                  "    g_settings.clear_fog = d->clear_fog;",
                  "    g_settings.clear_fog = d->clear_fog;\n"
                  "    g_settings.half_textures = d->half_textures;\n"
                  "    g_settings.no_gbuffer_split = d->no_gbuffer_split;\n"
                  "    g_settings.adpf_gpu = d->adpf_gpu;\n"
                  "    g_settings.no_shadows = d->no_shadows;\n"
                  "    g_settings.high_ram_cache = d->high_ram_cache;",
              ),
              (
                  '        else if (!strcmp(key, "clear_fog")) g_settings.clear_fog = atoi(val) != 0;',
                  '        else if (!strcmp(key, "clear_fog")) g_settings.clear_fog = atoi(val) != 0;\n'
                  '        else if (!strcmp(key, "half_textures")) g_settings.half_textures = atoi(val) != 0;\n'
                  '        else if (!strcmp(key, "no_gbuffer_split")) g_settings.no_gbuffer_split = atoi(val) != 0;\n'
                  '        else if (!strcmp(key, "adpf_gpu")) g_settings.adpf_gpu = atoi(val) != 0;\n'
                  '        else if (!strcmp(key, "no_shadows")) g_settings.no_shadows = atoi(val) != 0;\n'
                  '        else if (!strcmp(key, "high_ram_cache")) g_settings.high_ram_cache = atoi(val) != 0;',
              ),
              (
                  r'    fprintf(f, "fast_textures = %d\ndyn_floor_35 = %d\nclear_fog = %d\n", g_settings.fast_textures, g_settings.dyn_floor_35, g_settings.clear_fog);',
                  r'    fprintf(f, "fast_textures = %d\ndyn_floor_35 = %d\nclear_fog = %d\n", g_settings.fast_textures, g_settings.dyn_floor_35, g_settings.clear_fog);' + "\n" +
                  r'    fprintf(f, "half_textures = %d\nno_gbuffer_split = %d\nadpf_gpu = %d\nno_shadows = %d\nhigh_ram_cache = %d\n",' + "\n" +
                  r'            g_settings.half_textures, g_settings.no_gbuffer_split, g_settings.adpf_gpu, g_settings.no_shadows, g_settings.high_ram_cache);',
              ),
          ])

          patch("runtime/nvn/vulkan/textures.c", [
              (
                  "        static int half = -1;\n"
                  "        if (half < 0) {\n"
                  "            extern bool vk_low_ram(void);\n"
                  '            const char *e = getenv("LARECOMP_HALF_TEXTURES");\n'
                  "            half = e ? atoi(e) != 0 : vk_low_ram();\n"
                  '            if (half) LOG("[vk] textures from their second level (half size): low RAM\\n");\n'
                  "        }",
                  "        static int env_half = -2;\n"
                  "        if (env_half == -2) {\n"
                  '            const char *e = getenv("LARECOMP_HALF_TEXTURES");\n'
                  "            env_half = e ? (atoi(e) != 0 ? 1 : 0) : -1;\n"
                  "        }\n"
                  "        extern bool vk_low_ram(void);\n"
                  "#ifdef __ANDROID__\n"
                  "        bool half = env_half >= 0 ? env_half != 0 : (vk_low_ram() || g_settings.half_textures);\n"
                  "#else\n"
                  "        bool half = env_half >= 0 ? env_half != 0 : vk_low_ram();\n"
                  "#endif\n"
                  "        static bool logged_half = false;\n"
                  '        if (half && !logged_half) { logged_half = true; LOG("[vk] textures from their second level (half size)\\n"); }',
              ),
              (
                  '        si.compareOp = getenv("LARECOMP_NO_SHADOW") ? VK_COMPARE_OP_ALWAYS : compare_op(d->compare_func);',
                  "#ifdef __ANDROID__\n"
                  '        bool no_sh = g_settings.no_shadows || getenv("LARECOMP_NO_SHADOW") != NULL;\n'
                  "#else\n"
                  '        bool no_sh = getenv("LARECOMP_NO_SHADOW") != NULL;\n'
                  "#endif\n"
                  "        si.compareOp = no_sh ? VK_COMPARE_OP_ALWAYS : compare_op(d->compare_func);",
              ),
          ])

          patch("runtime/nvn/vulkan/exec.c", [
              (
                  "        plat_frame_work_gpu((uint64_t)(hint_busy * 1e6), no_gpu ? 0 : gpu, budget, (uint64_t)(game_busy * 1e6));",
                  "        plat_frame_work_gpu((uint64_t)(hint_busy * 1e6), (!no_gpu || g_settings.adpf_gpu) ? gpu : 0, budget, (uint64_t)(game_busy * 1e6));",
              ),
              (
                  "static int pipe_keep(void) {\n"
                  "    static int keep = -1;\n"
                  "    if (keep < 0) {\n"
                  "        extern bool vk_low_ram(void);\n"
                  '        const char *e = getenv("LARECOMP_PIPE_KEEP");\n'
                  "        // (every GPU but Adreno's: an Xclipse 530 reached 8165 pipelines and 1.6 GB of malloc in an hour, an Xclipse 540\n"
                  "        // 4375 in 10 minutes, killed for low memory - #327 #345; Turnip's cost little each)\n"
                  "        keep = e ? atoi(e) : (g_vk.props.vendorID != 0x5143 || vk_low_ram()) ? 1500 : 0;\n"
                  '        if (keep > 0) LOG("[vk] pipelines kept: at most %d (the least recently used ones destroyed)\\n", keep);\n'
                  "    }\n"
                  "    return keep;\n"
                  "}",
                  "static int pipe_keep(void) {\n"
                  "    static int env_keep = -2;\n"
                  "    if (env_keep == -2) {\n"
                  '        const char *e = getenv("LARECOMP_PIPE_KEEP");\n'
                  "        env_keep = e ? atoi(e) : -1;\n"
                  "    }\n"
                  "    if (env_keep >= 0) return env_keep;\n"
                  "    extern bool vk_low_ram(void);\n"
                  "#ifdef __ANDROID__\n"
                  "    int keep = vk_low_ram() ? 1500 : g_settings.high_ram_cache ? 6000 : (g_vk.props.vendorID != 0x5143 ? 1500 : 0);\n"
                  "#else\n"
                  "    int keep = (g_vk.props.vendorID != 0x5143 || vk_low_ram()) ? 1500 : 0;\n"
                  "#endif\n"
                  "    static int logged = -1;\n"
                  "    if (keep != logged) {\n"
                  "        logged = keep;\n"
                  '        if (keep > 0) LOG("[vk] pipelines kept: at most %d (the least recently used ones destroyed)\\n", keep);\n'
                  "    }\n"
                  "    return keep;\n"
                  "}",
              ),
              (
                  "static uint64_t vc_budget(void) {\n"
                  "    static uint64_t b;\n"
                  "    if (!b) {\n"
                  '        const char *e = getenv("LARECOMP_VC_BUDGET_MB");\n'
                  "        long total_kb = 0;\n"
                  '        FILE *f = fopen("/proc/meminfo", "r");\n'
                  "        if (f) {\n"
                  '            if (fscanf(f, "MemTotal: %ld kB", &total_kb) != 1) total_kb = 0;\n'
                  "            fclose(f);\n"
                  "        }\n"
                  "        b = 768ull << 20;\n"
                  "        if (vk_low_ram() && total_kb && (uint64_t)total_kb * 1024 / 12 < b)\n"
                  "            b = (uint64_t)total_kb * 1024 / 12;\n"
                  "        if (e && atol(e) > 0) b = (uint64_t)atol(e) << 20;\n"
                  '        LOG("[vk] buffer cache: up to %llu MB on the GPU\\n", (unsigned long long)(b >> 20));\n'
                  "    }\n"
                  "    return b;\n"
                  "}",
                  "static uint64_t vc_budget(void) {\n"
                  "    static long total_kb = -1;\n"
                  "    static long env_mb = -2;\n"
                  "    if (env_mb == -2) {\n"
                  '        const char *e = getenv("LARECOMP_VC_BUDGET_MB");\n'
                  "        env_mb = (e && atol(e) > 0) ? atol(e) : 0;\n"
                  '        FILE *f = fopen("/proc/meminfo", "r");\n'
                  "        total_kb = 0;\n"
                  "        if (f) {\n"
                  '            if (fscanf(f, "MemTotal: %ld kB", &total_kb) != 1) total_kb = 0;\n'
                  "            fclose(f);\n"
                  "        }\n"
                  "    }\n"
                  "    if (env_mb > 0) return (uint64_t)env_mb << 20;\n"
                  "#ifdef __ANDROID__\n"
                  "    uint64_t b = (g_settings.high_ram_cache && !vk_low_ram()) ? (1536ull << 20) : (768ull << 20);\n"
                  "#else\n"
                  "    uint64_t b = 768ull << 20;\n"
                  "#endif\n"
                  "    if (vk_low_ram() && total_kb > 0 && (uint64_t)total_kb * 1024 / 12 < b)\n"
                  "        b = (uint64_t)total_kb * 1024 / 12;\n"
                  "    static uint64_t logged;\n"
                  "    if (b != logged) {\n"
                  "        logged = b;\n"
                  '        LOG("[vk] buffer cache: up to %llu MB on the GPU\\n", (unsigned long long)(b >> 20));\n'
                  "    }\n"
                  "    return b;\n"
                  "}",
              ),
              (
                  "    static long split = -1;\n"
                  "    if (split < 0) {  // (3 ms by default; not on Qualcomm's driver, as LARECOMP_VK_CHUNK_US)\n"
                  "        extern bool vk_driver_is_qualcomm(void);\n"
                  '        const char *e = getenv("LARECOMP_VK_SPLIT_US");\n'
                  "        split = e ? atol(e) : vk_driver_is_qualcomm() ? 0 : 3000;\n"
                  "    }",
                  "    static long split = -1;\n"
                  "    static bool env_set = false;\n"
                  "    if (split < 0) {  // (3 ms by default; not on Qualcomm's driver, as LARECOMP_VK_CHUNK_US)\n"
                  "        extern bool vk_driver_is_qualcomm(void);\n"
                  '        const char *e = getenv("LARECOMP_VK_SPLIT_US");\n'
                  "        env_set = e != NULL;\n"
                  "        split = e ? atol(e) : vk_driver_is_qualcomm() ? 0 : 3000;\n"
                  "    }\n"
                  "    if (g_settings.no_gbuffer_split && !env_set) return;",
              ),
          ])

          patch("runtime/ui/menu.mm", [
              (
                  '    opt_toggle("Clear Fog (No Haze)", &g_settings.clear_fog, false,\n'
                  '               "Cuts atmospheric fog veil and restores contrast on the 3D scene without affecting HUD or menus.");',
                  '    opt_toggle("Clear Fog (No Haze)", &g_settings.clear_fog, false,\n'
                  '               "Cuts atmospheric fog veil and restores contrast on the 3D scene without affecting HUD or menus.");\n'
                  '    opt_toggle("Half-Size World Textures", &g_settings.half_textures, false,\n'
                  '               "Loads compressed 3D textures at half resolution (1/4 VRAM and bandwidth on Mali) without affecting "\n'
                  '               "terrain heightmaps or UI. Applies to new textures / on restart.");\n'
                  '    opt_toggle("Disable G-Buffer Split (Mali)", &g_settings.no_gbuffer_split, false,\n'
                  '               "Stops splitting long G-buffer passes every 3 ms so tile GPUs like Mali avoid extra target reloads.");\n'
                  '    opt_toggle("ADPF GPU Boost Hint", &g_settings.adpf_gpu, false,\n'
                  '               "Sends GPU frame timing to Android ADPF (Android 15+) to help raise Mali clocks in heavy areas.");\n'
                  '    opt_toggle("Disable Dynamic Shadows", &g_settings.no_shadows, false,\n'
                  '               "Skips dynamic shadow comparisons for extra FPS in heavy areas. Applies to new samplers / on restart.");\n'
                  '    opt_toggle("Max RAM Cache (8GB+)", &g_settings.high_ram_cache, false,\n'
                  '               "Expands GPU buffer cache (768 -> 1536 MB) and kept Mali pipelines (1500 -> 6000) to use more free "\n'
                  '               "RAM and reduce stutters on 8GB+ phones. Ignored if RAM saving is On.");',
              ),
          ])

          print("All 5 new options patched cleanly.")
          EOF
          python3 /tmp/patch_fog.py

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add runtime/settings.h runtime/settings.c runtime/nvn/vulkan/textures.c runtime/nvn/vulkan/exec.c runtime/ui/menu.mm
            git commit -m "Add Mali optimization toggles and 8GB RAM cache option"
            git push
          else
            echo "No changes needed."
          fi
