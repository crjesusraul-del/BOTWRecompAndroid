name: Apply Clear Fog Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply Clear Fog and texture filter fixes
        run: |
          cat << 'EOF' > /tmp/patch_fog.py
          from pathlib import Path

          def patch(path_str, replacements):
              p = Path(path_str)
              s = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  if new in s:
                      continue
                  assert old in s, f"Pattern not found in {path_str}:\n{old[:120]}"
                  assert s.count(old) == 1, f"Multiple matches in {path_str}"
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")

          patch("runtime/nvn/vulkan/textures.c", [
              (
                  "    if (g_settings.fast_textures) {\n        if (mf > 1) si.mipLodBias += 0.5f;",
                  "    if (g_settings.fast_textures) {\n        if (mf > 1 && d->max_aniso > 1) si.mipLodBias += 0.5f;",
              ),
          ])

          patch("runtime/settings.h", [
              (
                  "    bool dyn_floor_35;",
                  "    bool dyn_floor_35;\n    bool clear_fog;       // Reduces atmospheric fog veil on the 3D scene before HUD",
              ),
          ])

          patch("runtime/settings.c", [
              (
                  "    .dyn_floor_35 = false,",
                  "    .dyn_floor_35 = false,\n    .clear_fog = false,",
              ),
              (
                  "    g_settings.dyn_floor_35 = d->dyn_floor_35;",
                  "    g_settings.dyn_floor_35 = d->dyn_floor_35;\n    g_settings.clear_fog = d->clear_fog;",
              ),
              (
                  '        else if (!strcmp(key, "dyn_floor_35")) g_settings.dyn_floor_35 = atoi(val) != 0;',
                  '        else if (!strcmp(key, "dyn_floor_35")) g_settings.dyn_floor_35 = atoi(val) != 0;\n        else if (!strcmp(key, "clear_fog")) g_settings.clear_fog = atoi(val) != 0;',
              ),
              (
                  r'    fprintf(f, "fast_textures = %d\ndyn_floor_35 = %d\n", g_settings.fast_textures, g_settings.dyn_floor_35);',
                  r'    fprintf(f, "fast_textures = %d\ndyn_floor_35 = %d\nclear_fog = %d\n", g_settings.fast_textures, g_settings.dyn_floor_35, g_settings.clear_fog);',
              ),
          ])

          patch("runtime/nvn/vulkan/shaders.c", [
              (
                  '               "    color.xyz = clamp(color.xyz + deltaY, 0.0, 1.0);\\n"\n'
                  '               "  }\\n"\n'
                  '               "  o = vec4(color.xyz, alpha);\\n"\n'
                  '               "}\\n";',
                  '               "    color.xyz = clamp(color.xyz + deltaY, 0.0, 1.0);\\n"\n'
                  '               "  }\\n"\n'
                  '               "  if (pc.b.z > 0.5) {\\n"\n'
                  '               "    vec3 c = color.xyz;\\n"\n'
                  '               "    float lum = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "    float veil = 0.085 * smoothstep(0.08, 0.45, lum);\\n"\n'
                  '               "    c = clamp((c - veil) / (1.0 - veil), 0.0, 1.0);\\n"\n'
                  '               "    c = mix(c, c * c * (3.0 - 2.0 * c), 0.30);\\n"\n'
                  '               "    float l2 = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "    color.xyz = clamp(mix(vec3(l2), c, 1.15), 0.0, 1.0);\\n"\n'
                  '               "  }\\n"\n'
                  '               "  o = vec4(color.xyz, alpha);\\n"\n'
                  '               "}\\n";',
              ),
              (
                  '               "  float lobe = max(-(0.25 - 1.0 / 16.0), min(max(lobeRGB.r, max(lobeRGB.g, lobeRGB.b)), 0.0)) * pc.a.x * nz;\\n"\n'
                  '               "  o = vec4((lobe * (b + d + f + h) + e) / (4.0 * lobe + 1.0), texelFetch(t, ip, 0).a);\\n"\n'
                  '               "}\\n";\n'
                  '    }',
                  '               "  float lobe = max(-(0.25 - 1.0 / 16.0), min(max(lobeRGB.r, max(lobeRGB.g, lobeRGB.b)), 0.0)) * pc.a.x * nz;\\n"\n'
                  '               "  vec3 c = (lobe * (b + d + f + h) + e) / (4.0 * lobe + 1.0);\\n"\n'
                  '               "  if (pc.a.y > 0.5) {\\n"\n'
                  '               "    float lum = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "    float veil = 0.085 * smoothstep(0.08, 0.45, lum);\\n"\n'
                  '               "    c = clamp((c - veil) / (1.0 - veil), 0.0, 1.0);\\n"\n'
                  '               "    c = mix(c, c * c * (3.0 - 2.0 * c), 0.30);\\n"\n'
                  '               "    float l2 = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "    c = clamp(mix(vec3(l2), c, 1.15), 0.0, 1.0);\\n"\n'
                  '               "  }\\n"\n'
                  '               "  o = vec4(c, texelFetch(t, ip, 0).a);\\n"\n'
                  '               "}\\n";\n'
                  '    }\n'
                  '    if (!strcmp(name, "clearfog.frag")) {\n'
                  '        *stage = STAGE_FRAGMENT;\n'
                  '        return "#version 450\\n"\n'
                  '               "layout(set = 0, binding = 0) uniform sampler2D t;\\n"\n'
                  '               "layout(push_constant) uniform P { vec4 a; vec4 b; } pc;\\n"\n'
                  '               "layout(location = 0) out vec4 o;\\n"\n'
                  '               "void main() {\\n"\n'
                  '               "  ivec2 ip = clamp(ivec2(gl_FragCoord.xy), ivec2(0), ivec2(pc.a.xy) - 1);\\n"\n'
                  '               "  vec4 px = texelFetch(t, ip, 0);\\n"\n'
                  '               "  vec3 c = px.rgb;\\n"\n'
                  '               "  float lum = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "  float veil = 0.085 * smoothstep(0.08, 0.45, lum);\\n"\n'
                  '               "  c = clamp((c - veil) / (1.0 - veil), 0.0, 1.0);\\n"\n'
                  '               "  c = mix(c, c * c * (3.0 - 2.0 * c), 0.30);\\n"\n'
                  '               "  float l2 = dot(c, vec3(0.299, 0.587, 0.114));\\n"\n'
                  '               "  o = vec4(clamp(mix(vec3(l2), c, 1.15), 0.0, 1.0), px.a);\\n"\n'
                  '               "}\\n";\n'
                  '    }',
              ),
          ])

          patch("runtime/nvn/vulkan/exec.c", [
              (
                  "    if (!on || (mode != UPSCALE_FSR1 && mode != UPSCALE_SGSR1)) return;",
                  "    bool upscale_mode = on && (mode == UPSCALE_FSR1 || mode == UPSCALE_SGSR1);\n"
                  "    if (!upscale_mode && !g_settings.clear_fog) return;",
              ),
              (
                  "        if (ow <= b->width + 1 && oh <= b->height + 1) return;  // (at its size in the final image already)\n"
                  "        VkFormatProperties fp;\n"
                  "        vkGetPhysicalDeviceFormatProperties(g_vk.phys, b->format, &fp);\n"
                  "        if (!(fp.optimalTilingFeatures & VK_FORMAT_FEATURE_COLOR_ATTACHMENT_BIT)) continue;\n"
                  "        vk_end_pass();\n"
                  "        VkCommandBuffer cb = vk_cmd();\n"
                  "        float iw = (float)b->width, ih = (float)b->height;\n"
                  "        static const VkComponentMapping id = {0};\n"
                  "        VkImageView in[3] = {vk_image_view(b, VK_IMAGE_VIEW_TYPE_2D, b->format, 0, 1, 0, 1, id, VK_IMAGE_ASPECT_COLOR_BIT)};\n"
                  "        TexBackend *o = post_image(6, ow, oh, b->format);\n"
                  '        gp_mark(cb, "scene upscale %ux%u -> %ux%u: %s", b->width, b->height, ow, oh, mode == UPSCALE_SGSR1 ? "sgsr1" : "easu");\n'
                  "        if (mode == UPSCALE_SGSR1) {\n"
                  "            float ps[8] = {1.0f / iw, 1.0f / ih, iw, ih, (float)ow, (float)oh};\n"
                  '            post_pass(cb, "sgsr1.frag", in, 1, o, ps, false);\n'
                  "        } else {\n"
                  "            TexBackend *e = post_image(5, ow, oh, b->format);\n"
                  "            float pe[8] = {iw / ow, ih / oh, 0.5f * iw / ow - 0.5f, 0.5f * ih / oh - 0.5f, iw, ih};\n"
                  '            post_pass(cb, "easu.frag", in, 1, e, pe, false);\n'
                  '            gp_mark(cb, "scene upscale: rcas");\n'
                  "            float pr_[8] = {exp2f(-0.2f), 0, 0, 0, (float)ow, (float)oh};  // (sharpness 0.2 stops: AMD's default)\n"
                  "            VkImageView ri[3] = {post_view(e)};\n"
                  '            post_pass(cb, "rcas.frag", ri, 1, o, pr_, false);\n'
                  "        }\n"
                  "        vk_full_barrier(cb);\n"
                  "        scene_up.t = t;\n"
                  "        scene_up.img = o;\n"
                  "        scene_up.view = post_view(o);\n"
                  "        scene_up.sx = (float)ow / (float)t->width;\n"
                  "        scene_up.sy = (float)oh / (float)t->height;\n"
                  "        static uint32_t lw, lh, low, loh;\n"
                  "        static int lmode = -1;\n"
                  "        if (b->width != lw || b->height != lh || ow != low || oh != loh || mode != lmode)\n"
                  '            LOG("[post] scene %ux%u -> %s %ux%u (format %d)\\n", b->width, b->height, mode == UPSCALE_SGSR1 ? "sgsr1" : "fsr1",\n'
                  "                ow, oh, b->format);\n"
                  "        lw = b->width; lh = b->height; low = ow; loh = oh; lmode = mode;",
                  "        bool need_up = upscale_mode && (ow > b->width + 1 || oh > b->height + 1);\n"
                  "        if (!need_up && !g_settings.clear_fog) return;\n"
                  "        uint32_t dw = need_up ? ow : b->width, dh = need_up ? oh : b->height;\n"
                  "        VkFormatProperties fp;\n"
                  "        vkGetPhysicalDeviceFormatProperties(g_vk.phys, b->format, &fp);\n"
                  "        if (!(fp.optimalTilingFeatures & VK_FORMAT_FEATURE_COLOR_ATTACHMENT_BIT)) continue;\n"
                  "        vk_end_pass();\n"
                  "        VkCommandBuffer cb = vk_cmd();\n"
                  "        float iw = (float)b->width, ih = (float)b->height;\n"
                  "        static const VkComponentMapping id = {0};\n"
                  "        VkImageView in[3] = {vk_image_view(b, VK_IMAGE_VIEW_TYPE_2D, b->format, 0, 1, 0, 1, id, VK_IMAGE_ASPECT_COLOR_BIT)};\n"
                  "        TexBackend *o = post_image(6, dw, dh, b->format);\n"
                  '        gp_mark(cb, "scene upscale %ux%u -> %ux%u: %s", b->width, b->height, dw, dh,\n'
                  '                !need_up ? "clearfog" : mode == UPSCALE_SGSR1 ? "sgsr1" : "easu");\n'
                  "        if (!need_up) {\n"
                  "            float ps[8] = {(float)dw, (float)dh};\n"
                  '            post_pass(cb, "clearfog.frag", in, 1, o, ps, false);\n'
                  "        } else if (mode == UPSCALE_SGSR1) {\n"
                  "            float ps[8] = {1.0f / iw, 1.0f / ih, iw, ih, (float)dw, (float)dh, g_settings.clear_fog ? 1.0f : 0.0f};\n"
                  '            post_pass(cb, "sgsr1.frag", in, 1, o, ps, false);\n'
                  "        } else {\n"
                  "            TexBackend *e = post_image(5, dw, dh, b->format);\n"
                  "            float pe[8] = {iw / dw, ih / dh, 0.5f * iw / dw - 0.5f, 0.5f * ih / dh - 0.5f, iw, ih};\n"
                  '            post_pass(cb, "easu.frag", in, 1, e, pe, false);\n'
                  '            gp_mark(cb, "scene upscale: rcas");\n'
                  "            float pr_[8] = {exp2f(-0.2f), g_settings.clear_fog ? 1.0f : 0.0f, 0, 0, (float)dw, (float)dh};\n"
                  "            VkImageView ri[3] = {post_view(e)};\n"
                  '            post_pass(cb, "rcas.frag", ri, 1, o, pr_, false);\n'
                  "        }\n"
                  "        vk_full_barrier(cb);\n"
                  "        scene_up.t = t;\n"
                  "        scene_up.img = o;\n"
                  "        scene_up.view = post_view(o);\n"
                  "        scene_up.sx = (float)dw / (float)t->width;\n"
                  "        scene_up.sy = (float)dh / (float)t->height;\n"
                  "        static uint32_t lw, lh, low, loh;\n"
                  "        static int lmode = -1;\n"
                  "        if (b->width != lw || b->height != lh || dw != low || dh != loh || mode != lmode)\n"
                  '            LOG("[post] scene %ux%u -> %s %ux%u (format %d)\\n", b->width, b->height,\n'
                  '                !need_up ? "clearfog" : mode == UPSCALE_SGSR1 ? "sgsr1" : "fsr1", dw, dh, b->format);\n'
                  "        lw = b->width; lh = b->height; low = dw; loh = dh; lmode = mode;",
              ),
          ])

          patch("runtime/ui/menu.mm", [
              (
                  '    opt_toggle("Dynamic Res Floor 35%", &g_settings.dyn_floor_35, false,\n'
                  '               "Allows Dynamic Internal Resolution to scale down to 35% instead of stopping at 50% in heavy areas "\n'
                  '               "to hold 30 fps.");',
                  '    opt_toggle("Dynamic Res Floor 35%", &g_settings.dyn_floor_35, false,\n'
                  '               "Allows Dynamic Internal Resolution to scale down to 35% instead of stopping at 50% in heavy areas "\n'
                  '               "to hold 30 fps.");\n'
                  '    opt_toggle("Clear Fog (No Haze)", &g_settings.clear_fog, false,\n'
                  '               "Cuts atmospheric fog veil and restores contrast on the 3D scene without affecting HUD or menus.");',
              ),
          ])

          print("All 6 files patched cleanly.")
          EOF
          python3 /tmp/patch_fog.py

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add runtime/nvn/vulkan/textures.c runtime/settings.h runtime/settings.c runtime/nvn/vulkan/shaders.c runtime/nvn/vulkan/exec.c runtime/ui/menu.mm
            git commit -m "Fix fast_textures and add Clear Fog toggle"
            git push
          else
            echo "No changes needed."
          fi
