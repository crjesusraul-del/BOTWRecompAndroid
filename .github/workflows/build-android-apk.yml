name: Build BOTWRecompAndroid APK (Edge 40 Neo)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Runtime & Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK, NDK 30 and CMake 3.30.4
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_VER="30.0.16248370"
          CMAKE_VER="3.30.4"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VER" \
            "cmake;$CMAKE_VER"

          echo "$SDK_ROOT/cmake/$CMAKE_VER/bin" >> "$GITHUB_PATH"

      - name: Install host build tools for FFmpeg & Unicorn
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm pkg-config python3-pip autoconf automake libtool

      - name: Cache compiled Android native dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: botw-deps-arm64-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}

      - name: Build SDL3, shaderc, Vulkan headers and fonts
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash android/deps/build_deps.sh

      - name: Build FFmpeg for Android arm64
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash android/deps/build_ffmpeg.sh

      - name: Build on-device codegen tools (Python, Zig, Capstone, Unicorn, LZ4)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash android/deps/build_gen_deps.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android/botwrecompandroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/botwrecompandroid/app/build/outputs/apk/debug/app-debug.apk \
             dist/BOTWRecompAndroid-Edge40Neo-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTWRecompAndroid-Edge40Neo-APK
          path: dist/*.apk
          if-no-files-found: error
